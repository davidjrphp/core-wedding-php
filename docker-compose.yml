services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: wedding_app
    volumes:
      - ./public:/var/www/html/public
      - ./includes:/var/www/html/includes
      - ./config.sample.php:/var/www/html/config.sample.php:ro
      - ./config.php:/var/www/html/config.php:ro
      - ./schema.sql:/var/www/html/schema.sql:ro
    environment:
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_MAX_FILESIZE: 20M
      PHP_POST_MAX_SIZE: 21M
    networks: [wedding_net]

  web:
    image: nginx:1.25-alpine
    container_name: wedding_web
    ports:
      - "8083:80"
    volumes:
      - ./public:/var/www/html/public
      - ./includes:/var/www/html/includes
      - ./config.sample.php:/var/www/html/config.sample.php:ro
      - ./config.php:/var/www/html/config.php:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [wedding_net]

networks:
  wedding_net: {}
