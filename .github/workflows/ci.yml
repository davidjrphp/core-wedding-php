name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: PHP syntax check
        run: |
          find public includes -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build app image
        run: |
          docker build -f docker/app/Dockerfile -t core-wedding-php-app:ci .
          docker tag core-wedding-php-app:ci ghcr.io/${{ github.repository_owner }}/core-wedding-php-app:ci

      - name: Build web image
        run: |
          docker build -f docker/nginx/Dockerfile -t core-wedding-php-web:ci .
          docker tag core-wedding-php-web:ci ghcr.io/${{ github.repository_owner }}/core-wedding-php-web:ci

      - name: Smoke test the stack
        run: |
          cat > .env <<'EOF'
          DB_HOST=postgres
          DB_PORT=5432
          DB_NAME=wedding
          DB_USER=wedding_app
          DB_PASS=ci-test-pass
          ADMIN_EMAIL=admin@example.com
          ADMIN_PASSWORD=ci-test-admin
          BASE_URL=http://localhost:8083
          GHCR_OWNER=${{ github.repository_owner }}
          IMAGE_TAG=ci
          EOF
          docker compose -f docker-compose.prod.yml up -d postgres
          sleep 5
          docker compose -f docker-compose.prod.yml up -d app web
          sleep 5
          curl -sf http://localhost:8083/ -o /dev/null && echo "Homepage OK"
          docker compose -f docker-compose.prod.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
